services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: mc-forge-server
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "FORGE"
      VERSION: "1.20.1"
      MEMORY: "6G"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD:-change_me_rcon_password}"
      MAX_PLAYERS: "10"
      VIEW_DISTANCE: "12"
      SIMULATION_DISTANCE: "8"
      DIFFICULTY: "normal"
      MOTD: "A Modded Minecraft Server (Forge 1.20.1)"
      OPS: "Wakaria"
      ONLINE_MODE: "false"
    volumes:
      - ./data:/data
    tty: true
    stdin_open: true

  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: mc-wireguard-tunnel
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - ./wireguard:/config
      - /lib/modules:/lib/modules:ro
