services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: mc-forge-server
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "FORGE"
      VERSION: "1.20.1"
      MEMORY: "6G"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD:-change_me_rcon_password}"
      MAX_PLAYERS: "10"
      VIEW_DISTANCE: "12"
      SIMULATION_DISTANCE: "8"
      DIFFICULTY: "normal"
      MOTD: "A Modded Minecraft Server (Forge 1.20.1)"
      OPS: "Wakaria"
    volumes:
      - ./data:/data
    tty: true
    stdin_open: true

  playit:
    image: ghcr.io/playit-cloud/playit-agent:1.0
    container_name: mc-playit-tunnel
    restart: unless-stopped
    network_mode: host
    environment:
      - SECRET_KEY=${PLAYIT_SECRET_KEY}
