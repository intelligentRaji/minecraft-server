services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: mc-forge-server
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "FORGE"
      VERSION: "1.20.1"
      MEMORY: "6G"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "minecraftserverrcon"
      MAX_PLAYERS: "10"
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "8"
      DIFFICULTY: "normal"
      MOTD: "A Modded Minecraft Server (Forge 1.20.1)"
    volumes:
      - ./data:/data
    tty: true
    stdin_open: true
