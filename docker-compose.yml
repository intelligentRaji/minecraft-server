name: minecraft-server

services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: mc-forge-server
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "FORGE"
      VERSION: "1.20.1"
      MEMORY: "6G"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD:-change_me_rcon_password}"
      MAX_PLAYERS: "10"
      VIEW_DISTANCE: "12"
      SIMULATION_DISTANCE: "8"
      DIFFICULTY: "normal"
      MOTD: "A Modded Minecraft Server (Forge 1.20.1)"
      OPS: "Wakaria"
      ONLINE_MODE: "false"
    volumes:
      - ./server/data:/data
      - ./server/mods:/mods:ro
      - ./server/sync_mod_configurations.py:/sync_mod_configurations.py:ro
    entrypoint: ["/bin/bash", "-c", "python3 /sync_mod_configurations.py && exec /start"]
    tty: true
    stdin_open: true

  modsync-api:
    build:
      context: ./modsync_api
    container_name: mc-modsync-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      - "${MODSYNC_WG_IP:-127.0.0.2}:8080:8080"
    environment:
      MODPACK_DIR: "/modpack"
      MODSYNC_ADMIN_TOKEN: "${MODSYNC_ADMIN_TOKEN:-}"
      MODSYNC_CLIENT_TOKEN: "${MODSYNC_CLIENT_TOKEN:-}"
      MODSYNC_WATCH_INTERVAL: "3.0"
    volumes:
      - ./server/modpack:/modpack:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3

  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: mc-wireguard-tunnel
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - ./wireguard:/config
      - /lib/modules:/lib/modules:ro
