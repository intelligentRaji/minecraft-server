name: Release ModSync Client

on:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - "client-e2e/**"
      - "modsync_api/**"
    tags:
      - "client-v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create/update GitHub Release for the current client/pyproject.toml version"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.plan.outputs.app_version }}
      tag_name: ${{ steps.plan.outputs.tag_name }}
      should_release: ${{ steps.plan.outputs.should_release }}
      artifact_run_id: ${{ steps.plan.outputs.artifact_run_id }}
      needs_build: ${{ steps.plan.outputs.needs_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve release plan and reusable CI artifacts
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m ci prepare-release

  test-server-manifest:
    needs: [prepare-release]
    if: needs.prepare-release.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Run modsync_api tests
        working-directory: modsync_api
        run: |
          uv sync --group dev
          uv run pytest

  build-client:
    needs: [prepare-release, test-server-manifest]
    if: needs.prepare-release.outputs.needs_build == 'true' && needs.test-server-manifest.result == 'success'
    uses: ./.github/workflows/build-client.yml
    with:
      app_version: ${{ needs.prepare-release.outputs.app_version }}
      retention_days: 7

  publish-release:
    needs: [prepare-release, build-client]
    if: >-
      always() && !cancelled() &&
      needs.prepare-release.result == 'success' &&
      needs.prepare-release.outputs.should_release == 'true' &&
      (needs.prepare-release.outputs.artifact_run_id != '' || needs.build-client.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download verified artifacts from CI Tests run
        if: needs.prepare-release.outputs.artifact_run_id != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ needs.prepare-release.outputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts
          pattern: ModSync-*
          merge-multiple: true
      - name: Download built artifacts from build-client job
        if: needs.prepare-release.outputs.artifact_run_id == ''
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ModSync-*
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: sha256sum ModSync.exe ModSync-Setup.exe ModSync-linux > checksums.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            artifacts/ModSync.exe
            artifacts/ModSync-Setup.exe
            artifacts/ModSync-linux
            artifacts/checksums.txt
