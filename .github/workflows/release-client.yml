name: Release ModSync Client

on:
  push:
    tags:
      - "client-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-server-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Run modsync_api tests
        working-directory: modsync_api
        run: |
          uv sync --group dev
          uv run pytest
          python3 -m unittest tests/test_manifest.py

  build-client:
    needs: test-server-manifest
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: ModSync-windows
            upload-path: |
              client/dist/ModSync.exe
              client/dist/ModSync-Setup.exe
          - os: ubuntu-latest
            artifact: ModSync-linux
            upload-path: client/dist/ModSync-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Resolve client version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/client-v* ]]; then
            echo "app_version=${GITHUB_REF_NAME#client-v}" >> "$GITHUB_OUTPUT"
          else
            ver="$(python3 -c 'import tomllib; print(tomllib.load(open("client/pyproject.toml", "rb"))["project"]["version"])')"
            echo "app_version=${ver}" >> "$GITHUB_OUTPUT"
          fi
      - name: Stamp client version for release tag
        if: startsWith(github.ref, 'refs/tags/client-v')
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p = Path("client/src/modsync_client/__init__.py"); p.write_text("\"\"\"ModSync background client package.\"\"\"\n\n__version__ = \"${{ steps.version.outputs.app_version }}\"\n", encoding="utf-8")'
      - name: Install client dependencies and run tests
        working-directory: client
        run: |
          uv sync --group dev
          uv run pytest -v
      - name: Build standalone binary with PyInstaller
        working-directory: client
        run: uv run pyinstaller modsync.spec --clean --noconfirm
      - name: Build Windows Installer (Inno Setup)
        if: matrix.os == 'windows-latest'
        working-directory: client
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.app_version }}" installer.iss
      - name: Rename Linux binary
        if: matrix.os == 'ubuntu-latest'
        run: mv client/dist/ModSync client/dist/ModSync-linux
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.upload-path }}

  publish-release:
    needs: build-client
    if: startsWith(github.ref, 'refs/tags/client-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: sha256sum ModSync.exe ModSync-Setup.exe ModSync-linux > checksums.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/ModSync.exe
            artifacts/ModSync-Setup.exe
            artifacts/ModSync-linux
            artifacts/checksums.txt
