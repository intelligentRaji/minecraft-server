name: CI Tests

on:
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Run server sync tests
        run: python3 -m unittest discover -s server -p "test_sync*.py"
      - name: Run CI module tests
        run: python3 -m unittest discover -s ci/tests -p "test_*.py" -v
      - name: Run modsync_api tests
        working-directory: modsync_api
        run: |
          uv sync --group dev
          uv run pytest -v
      - name: Run client tests
        working-directory: client
        run: |
          uv sync --group dev
          uv run pytest -v

  resolve-e2e:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      run_e2e: ${{ steps.decision.outputs.run_e2e }}
      app_version: ${{ steps.decision.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve whether client E2E must run
        id: decision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m ci resolve-e2e

  client-e2e:
    needs: [resolve-e2e]
    if: needs.resolve-e2e.outputs.run_e2e == 'true'
    uses: ./.github/workflows/build-client.yml
    with:
      app_version: ${{ needs.resolve-e2e.outputs.app_version }}
      source_repo: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      event_name: ${{ github.event_name }}
      retention_days: 7
