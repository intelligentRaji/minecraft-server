name: Build and Test ModSync Client

on:
  workflow_call:
    inputs:
      app_version:
        description: "Client version injected into __init__.py, Windows installer, and build-meta.json"
        required: true
        type: string
      source_repo:
        description: "Source repository full name recorded in build-meta.json"
        required: false
        type: string
        default: ""
      head_sha:
        description: "Head commit SHA recorded in build-meta.json"
        required: false
        type: string
        default: ""
      event_name:
        description: "Triggering event name recorded in build-meta.json"
        required: false
        type: string
        default: ""
      retention_days:
        description: "Uploaded artifact retention days"
        required: false
        type: number
        default: 7

jobs:
  build-client:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ModSync-windows
            upload-path: |
              client/dist/ModSync.exe
              client/dist/ModSync-Setup.exe
          - os: ubuntu-latest
            artifact: ModSync-linux
            upload-path: client/dist/ModSync-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Exclude workspace and temp paths from Windows Defender
        if: matrix.os == 'windows-latest'
        run: python3 -m ci win-defender-exclude
      - name: Set up MSVC environment for Windows PyInstaller bootloader build
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Sync client __version__ with build version
        run: python3 -m ci sync-version --version "${{ inputs.app_version }}"
      - name: Install client dependencies (Windows, source-built PyInstaller bootloader)
        if: matrix.os == 'windows-latest'
        working-directory: client
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: uv sync --group dev --no-binary-package pyinstaller
      - name: Install Linux Tkinter and X11 E2E dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb xdotool openbox tint2
      - name: Install client dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: client
        run: uv sync --group dev
      - name: Run client tests
        working-directory: client
        run: uv run --no-sync pytest -v
      - name: Build standalone binary with PyInstaller
        working-directory: client
        run: uv run --no-sync pyinstaller modsync.spec --clean --noconfirm
      - name: Build Windows Installer (Inno Setup)
        if: matrix.os == 'windows-latest'
        run: python3 -m ci win-build-installer --version "${{ inputs.app_version }}"
      - name: Rename Linux binary
        if: matrix.os == 'ubuntu-latest'
        run: mv client/dist/ModSync client/dist/ModSync-linux
      - name: Sync modsync_api dependencies
        working-directory: modsync_api
        run: uv sync
      - name: Install client-e2e dependencies
        working-directory: client-e2e
        run: uv sync
      - name: Run client E2E tests (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: client-e2e
        env:
          MODSYNC_INSTALLER: ${{ github.workspace }}/client/dist/ModSync-Setup.exe
          MODSYNC_E2E_ALLOW_HOST_INSTALLER: "1"
          MODSYNC_E2E_ARTIFACTS_DIR: ${{ github.workspace }}/client-e2e/artifacts
        run: uv run --no-sync pytest -v
      - name: Run client E2E tests (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: client-e2e
        env:
          MODSYNC_BIN: ${{ github.workspace }}/client/dist/ModSync-linux
          MODSYNC_E2E_ARTIFACTS_DIR: ${{ github.workspace }}/client-e2e/artifacts
        run: uv run --no-sync pytest -v
      - name: Upload client E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: client-e2e-diagnostics-${{ matrix.os }}
          path: client-e2e/artifacts
          if-no-files-found: ignore
          retention-days: ${{ inputs.retention_days }}
      - name: Upload verified build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.upload-path }}
          retention-days: ${{ inputs.retention_days }}
      - name: Write build verification metadata
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 -m ci write-meta \
            --output client/dist/build-meta.json \
            --version "${{ inputs.app_version }}" \
            --source-repo "${{ inputs.source_repo || github.repository }}" \
            --head-sha "${{ inputs.head_sha || github.sha }}" \
            --event "${{ inputs.event_name || github.event_name }}"
      - name: Upload build verification metadata
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: build-meta
          path: client/dist/build-meta.json
          retention-days: ${{ inputs.retention_days }}
