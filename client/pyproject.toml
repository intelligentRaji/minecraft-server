[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "modsync-client"
version = "0.1.0"
description = "Background Minecraft modpack synchronizer with WebSocket push updates and system tray UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0,<1.0.0",
  "pillow>=10.0.0,<12.0.0",
  "psutil>=6.0.0,<7.0.0",
  "pystray>=0.19.5,<1.0.0",
  "websockets>=13.0,<15.0",
]

[dependency-groups]
dev = [
  "pyinstaller>=6.10.0,<7.0.0",
  "pytest>=8.0.0,<9.0.0",
]

[project.scripts]
modsync = "modsync_client.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
