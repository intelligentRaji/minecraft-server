[project]
name = "modsync-client-e2e"
version = "0.1.0"
description = "Cross-platform E2E test suite for ModSync client binaries and Windows installer"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
  "psutil>=6.0.0,<7.0.0",
  "pytest>=8.0.0,<9.0.0",
  "python-xlib>=0.33; sys_platform == 'linux'",
  "uvicorn[standard]>=0.32.0,<1.0.0",
  "websockets>=13.0,<15.0",
]

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]
